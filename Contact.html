<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Shree Interior</title>
    <link rel="stylesheet" href="./Homepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
<main class="mainParent">
    <nav class="navbar">
        <div class="child second">
            <h1>Shree Interior</h1>
        </div>
        <div class="child third">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-solid fa-envelope"></i>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-card">
            <div class="contact-image">
                <img src="./image/home3.png" alt="Interior Design">
            </div>
            <div class="contact-text">
                <h2>Contact Us</h2>
                <p>Fill out the form below with your contact details and project information, and our interior design team will get back to you soon.</p>
                <form class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required>
                    <label for="message">Project Details</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us about your space and goals"></textarea>
                    <button type="submit">Send Inquiry</button>
                </form>
            </div>
        </div>
    </section>
</main>

<script src="./script.js"></script>
</body>
</html>
